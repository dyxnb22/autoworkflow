[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-loop"
version = "0.11.0"
description = "Role-separated delivery engine: planner/reviewer vs implementer, with a hard test gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cc-loop = "cc_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
