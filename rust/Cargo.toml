[workspace]
resolver = "2"
members = [
    "crates/cc-loop-core",
    "crates/cc-loop-cli",
]
default-members = ["crates/cc-loop-cli"]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "MIT"
authors = ["cc-loop contributors"]
repository = "https://github.com/dyxnb22/autoworkflow"

[workspace.dependencies]
cc-loop-core = { path = "crates/cc-loop-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "=4.5.23", features = ["derive", "env"] }
fs2 = "0.4"
nix = { version = "0.29", features = ["process", "signal"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.14.0"
thiserror = "1"
uuid = { version = "=1.11.0", features = ["v4"] }
assert_cmd = "=2.0.14"
predicates = "3"
